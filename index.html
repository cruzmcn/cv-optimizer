<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<title>Optimizar CV para ONG | Mejora tu aplicación y consigue entrevistas</title>

<meta name="description" content="Descubre por qué tu CV no está avanzando en ONGs y recibe mejoras concretas. Analiza tu perfil frente a vacantes reales y aumenta tus probabilidades.">
<meta name="keywords" content="CV ONG, trabajo ONG, optimizar CV ONG">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
body {
  font-family: 'Inter', Arial;
  background: linear-gradient(135deg,#eef2ff,#f8fafc);
}

.container {
  max-width:900px;
  margin:60px auto;
  background:white;
  padding:40px;
  border-radius:16px;
}

textarea, input {
  width:100%;
  padding:14px;
  margin-top:10px;
  border-radius:10px;
  border:1px solid #ddd;
}

.row {
  display:flex;
  gap:10px;
}

button {
  width:100%;
  padding:16px;
  margin-top:20px;
  border:none;
  border-radius:12px;
  background:linear-gradient(90deg,#4f46e5,#7c3aed);
  color:white;
  font-size:16px;
}

.result {
  margin-top:20px;
  padding:20px;
  background:#f9fafb;
  border-radius:12px;
}

small {
  font-size:12px;
  color:#666;
}
</style>
</head>

<body>

<div class="container">

<h1>Descubre por qué tu CV no avanza en ONGs</h1>
<p>Sube tu CV o escribe tu experiencia.</p>

<input type="file" id="file" accept=".pdf,.txt">

<textarea id="cv" placeholder="Pega tu CV"></textarea>
<small>Puedes escribir tu experiencia aunque no tengas CV.</small>

<textarea id="job" placeholder="Vacante"></textarea>
<small>Copia la vacante real.</small>

<div class="row">
<input id="impact" placeholder="Impacto">
<input id="role" placeholder="Rol">
</div>

<input id="tools" placeholder="Herramientas">

<button onclick="run()">Analizar mi aplicación</button>

<div id="result"></div>

</div>

<script>

// PDF
document.getElementById("file").addEventListener("change", async function(e){
  const file = e.target.files[0];
  if(!file) return;

  if(file.type === "application/pdf"){
    const reader = new FileReader();
    reader.onload = async function(){
      const typedarray = new Uint8Array(this.result);
      const pdf = await pdfjsLib.getDocument(typedarray).promise;

      let text = "";
      for(let i=1;i<=pdf.numPages;i++){
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        const strings = content.items.map(item => item.str);
        text += strings.join(" ") + "\n";
      }

      document.getElementById("cv").value = text;
    };
    reader.readAsArrayBuffer(file);
  }
});

// ANALISIS
async function run(){

  let cvText = document.getElementById("cv").value || "";

  console.log("LENGTH CV:", cvText.length);

  if(cvText.trim().length < 80){
    result.innerHTML = `
      <div class="result">
        <b>Cuéntanos un poco más</b>
        <ul>
          <li>¿Qué hacías?</li>
          <li>¿Resultados?</li>
          <li>¿Con quién trabajabas?</li>
        </ul>
      </div>
    `;
    return;
  }

  result.innerHTML = "Analizando...";

  try{
    const res = await fetch("https://hook.us2.make.com/wa5vw1jfga23bsqd2is1mhqnn3pijfcr",{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({
        cv:cv.value,
        job:job.value,
        impact:impact.value,
        role:role.value,
        tools:tools.value
      })
    });

    const text = await res.text();

    console.log("RAW RESPONSE:", text);

    const data = JSON.parse(text);

    result.innerHTML = `
      <div class="result">
        <h3>Score: ${data.score}</h3>
        <p>${data.diagnostico}</p>
      </div>
    `;

  } catch(e){
    result.innerHTML = `<div class="result">Error: ${e.message}</div>`;
  }
}

</script>

</body>
</html>
