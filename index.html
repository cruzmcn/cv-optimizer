<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Optimiza tu aplicación a ONGs</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom, #f8fafc, #eef2ff);
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 800px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    textarea, input {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px;
      margin-top: 15px;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
    }

    .result {
      margin-top: 20px;
      background: #f9fafb;
      padding: 20px;
      border-radius: 10px;
    }

    .paywall {
      background: #fff3cd;
      padding: 15px;
      margin-top: 20px;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<div class="container">

<h2>Optimiza tu aplicación a ONGs</h2>

<p>Pega tu CV o súbelo como archivo.</p>

<input type="file" id="fileInput" accept=".txt,.pdf,.docx">

<textarea id="cv" placeholder="Tu CV aparecerá aquí..."></textarea>

<textarea id="job" placeholder="Pega la vacante aquí..."></textarea>

<textarea id="impact" placeholder="¿Qué impacto has tenido?"></textarea>
<input id="role" placeholder="¿Cuál fue tu rol principal?">
<input id="tools" placeholder="¿Usaste herramientas?">

<button onclick="runAnalysis()">Analizar</button>

<div id="result"></div>

</div>

<script>
document.getElementById('fileInput').addEventListener('change', async function(e) {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();

  reader.onload = function(e) {
    document.getElementById('cv').value = e.target.result;
  };

  reader.readAsText(file);
});

async function runAnalysis(){

  const cv = document.getElementById("cv").value;
  const job = document.getElementById("job").value;
  const impact = document.getElementById("impact").value;
  const role = document.getElementById("role").value;
  const tools = document.getElementById("tools").value;

  document.getElementById("result").innerHTML = "Analizando...";

  try {

    const response = await fetch("https://hook.us2.make.com/wa5vw1jfga23bsqd2is1mhqnn3pijfcr", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ cv, job, impact, role, tools })
    });

    const data = await response.json();

    document.getElementById("result").innerHTML = `
      <div class="result">
        <pre>${data.result}</pre>
      </div>

      <div class="paywall">
        <button>Mejorar mi aplicación – $1</button>
      </div>
    `;

  } catch (error) {
    document.getElementById("result").innerHTML = "Error";
  }
}
</script>

</body>
</html>
