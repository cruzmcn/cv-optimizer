<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<title>Optimizar CV para ONG | Mejora tu aplicación</title>

<meta name="description" content="Optimiza tu CV para ONG y aumenta tus probabilidades de ser seleccionado.">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin:0;
  font-family: 'Inter', Arial, sans-serif;
  background: linear-gradient(135deg,#eef2ff,#f8fafc);
}

.wrapper {
  display:flex;
  max-width:1200px;
  margin:40px auto;
  gap:20px;
}

.sidebar {
  width:35%;
  background:white;
  padding:30px;
  border-radius:16px;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

.main {
  width:65%;
  background:white;
  padding:30px;
  border-radius:16px;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

h1 { font-size:32px; }

.badge {
  background:#e0e7ff;
  padding:6px 12px;
  border-radius:20px;
  font-size:12px;
  display:inline-block;
  margin-bottom:10px;
}

.feature {
  margin-top:20px;
  display:flex;
  gap:10px;
}

input, textarea {
  width:100%;
  padding:14px;
  margin-top:12px;
  border-radius:10px;
  border:1px solid #ddd;
}

.upload {
  border:2px dashed #6366f1;
  padding:30px;
  text-align:center;
  border-radius:12px;
  margin-top:15px;
  cursor:pointer;
}

button {
  width:100%;
  padding:16px;
  margin-top:20px;
  border:none;
  border-radius:12px;
  background:linear-gradient(90deg,#4f46e5,#7c3aed);
  color:white;
  font-size:16px;
  cursor:pointer;
}

.result {
  margin-top:20px;
  padding:20px;
  background:#f9fafb;
  border-radius:12px;
  white-space:pre-wrap;
}

.paywall {
  background:#fff3cd;
  padding:20px;
  border-radius:12px;
  margin-top:20px;
  text-align:center;
}

/* SCORE */
.score-box {
  text-align:center;
  margin-bottom:15px;
}

.score-circle {
  width:90px;
  height:90px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto;
  font-size:22px;
  font-weight:bold;
  color:white;
}

/* Loader */
.loading-box {
  text-align:center;
  padding:30px;
}

.spinner {
  width:40px;
  height:40px;
  border:4px solid #ddd;
  border-top:4px solid #6d28d9;
  border-radius:50%;
  margin:0 auto 15px;
  animation:spin 1s linear infinite;
}

@keyframes spin {
  100% { transform:rotate(360deg); }
}
</style>
</head>

<body>

<div class="wrapper">

<div class="sidebar">
<div class="badge">Fase piloto</div>
<h1>Optimiza tu CV para ONG</h1>
<p>Analiza tu currículum frente a vacantes reales.</p>

<div class="feature">✔ Diagnóstico real</div>
<div class="feature">✔ CV optimizado</div>
<div class="feature">✔ Cover letter</div>
</div>

<div class="main">

<h3>1. CV</h3>
<div class="upload" onclick="document.getElementById('file').click()">
Sube tu CV o haz clic
</div>

<input type="file" id="file">
<textarea id="cv"></textarea>

<h3>2. Vacante</h3>
<textarea id="job"></textarea>

<h3>3. Impacto</h3>
<input id="impact">

<h3>4. Rol</h3>
<input id="role">

<h3>5. Herramientas</h3>
<input id="tools">

<button onclick="runAnalysis()">Analizar mi aplicación</button>

<div id="result"></div>

</div>
</div>

<script>

// leer archivo
document.getElementById('file').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => document.getElementById('cv').value = e.target.result;
  reader.readAsText(file);
});

let steps = [
  "Analizando tu CV...",
  "Comparando con la vacante...",
  "Detectando mejoras..."
];

let interval;

async function runAnalysis(){

  const cv = cvInput = document.getElementById("cv").value;
  const job = document.getElementById("job").value;
  const impact = document.getElementById("impact").value;
  const role = document.getElementById("role").value;
  const tools = document.getElementById("tools").value;

  document.getElementById("result").innerHTML = `
    <div class="loading-box">
      <div class="spinner"></div>
      <p id="loadingText">Analizando...</p>
    </div>
  `;

  let i = 0;
  interval = setInterval(()=>{
    document.getElementById("loadingText").innerText = steps[i];
    i = (i+1)%steps.length;
  },1500);

  try {

    const res = await fetch("https://hook.us2.make.com/wa5vw1jfga23bsqd2is1mhqnn3pijfcr", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({cv,job,impact,role,tools})
    });

    const text = await res.text();
    clearInterval(interval);

    const data = JSON.parse(text);
    const resultText = (data.result || "").toLowerCase();

    // 🔥 SCORE
    let score = 50;
    let color = "#f59e0b";

    if(resultText.includes("alto")) {
      score = 85;
      color = "#16a34a";
    } else if(resultText.includes("medio")) {
      score = 60;
      color = "#f59e0b";
    } else if(resultText.includes("bajo")) {
      score = 35;
      color = "#dc2626";
    }

    // 🔥 MENSAJE
    let warning = score >= 75 
      ? `<p style="color:green;font-weight:bold;">Buen perfil. Estás bien posicionado.</p>`
      : `<p style="color:red;font-weight:bold;">Este perfil puede quedar fuera si no se optimiza.</p>`;

    document.getElementById("result").innerHTML = `
      <div class="result">

        <div class="score-box">
          <div class="score-circle" style="background:${color}">
            ${score}
          </div>
        </div>

        ${data.result}
        ${warning}

      </div>

      <div class="paywall">
        <button>Desbloquear CV optimizado – $1</button>
      </div>
    `;

  } catch(e){
    clearInterval(interval);
    document.getElementById("result").innerHTML = `
      <div class="result">
        Error: ${e.message}
      </div>
    `;
  }
}
</script>

</body>
</html>
