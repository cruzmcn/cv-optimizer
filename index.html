<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Optimizar CV ONG</title>

<style>
body { font-family: Arial; background:#f5f7ff; }

.container {
  max-width:800px;
  margin:40px auto;
  background:white;
  padding:30px;
  border-radius:12px;
}

.score-circle {
  width:90px; height:90px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:24px; color:white; margin:auto;
}
</style>
</head>

<body>

<div class="container">

<h2>Optimiza tu CV</h2>

<textarea id="cv" placeholder="CV"></textarea>
<textarea id="job" placeholder="Vacante"></textarea>
<input id="impact" placeholder="Impacto">
<input id="role" placeholder="Rol">
<input id="tools" placeholder="Herramientas">

<button onclick="run()">Analizar</button>

<div id="result"></div>

</div>

<script>
async function run(){

  const res = await fetch("https://hook.us2.make.com/wa5vw1jfga23bsqd2is1mhqnn3pijfcr", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({
      cv:cv.value,
      job:job.value,
      impact:impact.value,
      role:role.value,
      tools:tools.value
    })
  });

  let text = await res.text();
  let data;

  try {
    data = JSON.parse(text);
  } catch(e){
    document.getElementById("result").innerHTML = `
      <p>Error parseando JSON:</p>
      <pre>${text}</pre>
    `;
    return;
  }

  // 🔥 DEFENSIVO
  const errores = Array.isArray(data.errores_criticos)
    ? data.errores_criticos.join("<br>")
    : data.errores_criticos || "No disponible";

  const antes = data.mejora_ejemplo?.antes || "No disponible";
  const despues = data.mejora_ejemplo?.despues || "No disponible";

  let color = "#f59e0b";
  if(data.score > 75) color = "#16a34a";
  if(data.score < 50) color = "#dc2626";

  document.getElementById("result").innerHTML = `
    <div class="score-circle" style="background:${color}">
      ${data.score || "?"}
    </div>

    <h3>Nivel: ${data.nivel || "No definido"}</h3>

    <p><b>Diagnóstico:</b><br>${data.diagnostico || "No disponible"}</p>

    <p><b>Errores críticos:</b><br>${errores}</p>

    <p><b>Mejora:</b><br>
    <b>Antes:</b> ${antes}<br>
    <b>Después:</b> ${despues}
    </p>

    <button>Optimizar CV – $1</button>
  `;
}
</script>

</body>
</html>
