<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Optimiza tu CV para ONG</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
body {
  font-family: 'Inter', Arial, sans-serif;
  background: linear-gradient(135deg,#eef2ff,#f8fafc);
  margin:0;
}

.container {
  max-width:900px;
  margin:60px auto;
  background:white;
  padding:40px;
  border-radius:16px;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

h2 {
  font-size:32px;
}

.sub {
  color:#666;
  margin-bottom:20px;
}

textarea, input {
  width:100%;
  padding:14px;
  margin-top:10px;
  margin-bottom:15px;
  border-radius:10px;
  border:1px solid #ddd;
}

.row {
  display:flex;
  gap:10px;
}

.row input {
  flex:1;
}

button {
  width:100%;
  padding:16px;
  border:none;
  border-radius:12px;
  background:linear-gradient(90deg,#4f46e5,#7c3aed);
  color:white;
  font-size:16px;
  cursor:pointer;
}

.result {
  margin-top:20px;
  padding:20px;
  background:#f9fafb;
  border-radius:12px;
}

.score-circle {
  width:80px;
  height:80px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  margin:auto;
}

.loader {
  text-align:center;
}

.spinner {
  width:40px;
  height:40px;
  border:4px solid #ddd;
  border-top:4px solid #6d28d9;
  border-radius:50%;
  margin:auto;
  animation:spin 1s linear infinite;
}

@keyframes spin {
  100% { transform:rotate(360deg); }
}
</style>
</head>

<body>

<div class="container">

<h2>Descubre por qué tu CV no avanza en ONGs</h2>
<p class="sub">Sube tu CV o escribe tu experiencia. No tiene que estar perfecto.</p>

<input type="file" id="file" accept=".pdf,.txt">

<textarea id="cv" placeholder="O pega tu CV aquí..."></textarea>

<textarea id="job" placeholder="Pega la vacante..."></textarea>

<div class="row">
  <input id="impact" placeholder="Impacto">
  <input id="role" placeholder="Rol">
</div>

<input id="tools" placeholder="Herramientas">

<button onclick="run()">Analizar mi aplicación</button>

<div id="result"></div>

</div>

<script>

// 🔥 LECTURA PDF
document.getElementById("file").addEventListener("change", async function(e){

  const file = e.target.files[0];
  if(!file) return;

  if(file.type === "application/pdf"){

    const reader = new FileReader();

    reader.onload = async function(){
      const typedarray = new Uint8Array(this.result);
      const pdf = await pdfjsLib.getDocument(typedarray).promise;

      let text = "";

      for(let i = 1; i <= pdf.numPages; i++){
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        const strings = content.items.map(item => item.str);
        text += strings.join(" ") + "\n";
      }

      document.getElementById("cv").value = text;
    };

    reader.readAsArrayBuffer(file);

  } else {
    const reader = new FileReader();
    reader.onload = e => document.getElementById("cv").value = e.target.result;
    reader.readAsText(file);
  }

});


// 🔥 ANALISIS
async function run(){

  let cvText = document.getElementById("cv").value;

  // 🔴 VALIDACIÓN INTELIGENTE
  if(cvText.length < 200){

    document.getElementById("result").innerHTML = `
      <div class="result">
        <b>No pudimos leer bien tu CV.</b><br><br>

        Para analizarlo mejor, cuéntanos:

        <ul>
          <li>¿Qué hacías exactamente?</li>
          <li>¿Qué resultados lograste?</li>
          <li>¿Con quién trabajabas?</li>
        </ul>

        Luego vuelve a hacer clic en analizar.
      </div>
    `;
    return;
  }

  document.getElementById("result").innerHTML = `
    <div class="loader">
      <div class="spinner"></div>
      <p>Analizando...</p>
    </div>
  `;

  try {

    const res = await fetch("https://hook.us2.make.com/wa5vw1jfga23bsqd2is1mhqnn3pijfcr", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({
        cv:cv.value,
        job:job.value,
        impact:impact.value,
        role:role.value,
        tools:tools.value
      })
    });

    const data = await res.json();

    const errores = Array.isArray(data.errores_criticos)
      ? data.errores_criticos.join("<br>")
      : data.errores_criticos;

    let color = "#f59e0b";
    if(data.score > 75) color = "#16a34a";
    if(data.score < 50) color = "#dc2626";

    document.getElementById("result").innerHTML = `
      <div class="result">

        <div class="score-circle" style="background:${color}">
          ${data.score}
        </div>

        <h3>${data.nivel}</h3>

        <p><b>Diagnóstico:</b><br>${data.diagnostico}</p>

        <p><b>Errores:</b><br>${errores}</p>

        <p><b>Mejora:</b><br>
        <b>Antes:</b> ${data.mejora_ejemplo?.antes}<br>
        <b>Después:</b> ${data.mejora_ejemplo?.despues}
        </p>

        <div style="margin-top:20px;background:#fff3cd;padding:15px;border-radius:10px;">
          <button>Desbloquear CV optimizado – $1</button>
        </div>

      </div>
    `;

  } catch(e){
    document.getElementById("result").innerHTML = `
      <div class="result">
        Error: ${e.message}
      </div>
    `;
  }
}
</script>

</body>
</html>
